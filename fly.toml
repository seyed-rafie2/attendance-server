app = "attendance-server"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  DB_FILE = "/data/attendance.db"
  CORS_ORIGIN = "*"
  SEED_ON_EMPTY = "true"

[mounts]
  source = "attendance_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"